name: Update WakaTime Gist
on:
  schedule:
    - cron: '40 1 * * *'   # 每天 00:00 UTC（按需修改）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run wakatime-sync action
        uses: Azusa510/wakatime-sync@master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # 如果需要微信推送:
          # SCU_KEY: ${{ secrets.SCU_KEY }}
